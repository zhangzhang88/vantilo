name: Core checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check app and Reader sources
        run: npm run typecheck
      # This portable Node suite needs no macOS services, userData or test files.
      # Full Vitest/Reader/Electron tests require the verified local Workspace.
      # Never bypass the guarded Vitest config on a GitHub-hosted runner.
      - name: Test portable security and Reader boundaries
        run: node --test tests/ci-portable.test.mjs
